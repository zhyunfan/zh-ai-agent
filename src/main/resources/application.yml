spring:
  application:
    name: zh-ai-agent
  profiles:
    active: local
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: deepseek-r1:7b
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1024 #向量嵌入模型embedding的度，不设置会根据实际的向量数去指定维度的数量，最好确定一下
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
    mcp:
      client:
        sse:
          connections:
            server1:
              url: http://localhost:8127 #客户端连接的服务端的地址，此时sse的mcp服务手动开启在8127端口
  #        stdio:
#          servers-configuration: classpath:mcp-servers.json
  main:
    allow-bean-definition-overriding: true



server:
  port: 8123
  servlet:
    context-path: /api
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.zyf.controller
knife4j:
  enable: true
  setting:
    language: zh_cn
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug
#    org.springframework.ai: debug
